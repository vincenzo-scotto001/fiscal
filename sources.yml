# Fiscal media sources: where new videos, episodes, articles and headlines come from.
# Edit freely (open a PR), then run the "check-feeds" task in Actions to test your changes.
#
# Each source needs a name plus ONE of:
#   youtube: UC...          a YouTube channel ID (or its @handle, e.g. "@allin"). Shorts are skipped.
#   podcast: https://...    a podcast's RSS feed
#   rss:     https://...    any news site, blog or research feed (RSS or Atom)
#
# Optional, per source:
#   digest: true            include in the once-a-day headline digest instead of posting each item
#   include: [word, ...]    only items whose title contains one of these words
#   exclude: [word, ...]    skip items whose title contains one of these words

videos:
  label: Videos
  username: Fiscal Videos
  icon: "🎙️"
  webhook: DISCORD_WEBHOOK_VIDEOS
