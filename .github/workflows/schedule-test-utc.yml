name: Schedule test (temporary, UTC only)

# Posts nothing. Checks whether GitHub fires scheduled runs when the file has NO timezone line.
# Every 5 minutes from 12:02 PM to 6:57 PM New York time (17:02-23:57 UTC).
# Remove this file once the test is done.
on:
  schedule:
    - cron: '2-59/5 17-23 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report what triggered this run
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "Event: $EVENT"
          echo "Schedule: $SCHEDULE"
          if [ "$EVENT" = "schedule" ]; then echo "=> GitHub schedules work when there is no timezone line."; fi
          date -u
          
