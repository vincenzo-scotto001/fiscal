name: Fiscal media feeds

on:
  schedule:
    # Every 2 hours from 6:23 AM to 10:23 PM New York time. The first run after 8 AM
    # also posts the daily headline digests and the crypto board.
    - cron: '23 6-22/2 * * *'
      timezone: 'America/New_York'

  workflow_dispatch:
    inputs:
      task:
        description: 'What to run'
        type: choice
        default: check-feeds
        options:
          - check-feeds
          - test-post
          - feeds
          - digests
          - crypto-board
      dry_run:
        description: 'Preview only (prints the messages in the log, posts nothing)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fiscal-media-feeds
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # Remembers what has already been posted, so nothing is posted twice.
      - name: Restore memory
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: feeds-state-${{ github.run_id }}
          restore-keys: feeds-state-

      - name: Run media feeds
        env:
          DISCORD_WEBHOOK_VIDEOS: ${{ secrets.DISCORD_WEBHOOK_VIDEOS }}
          DISCORD_WEBHOOK_EDUCATION: ${{ secrets.DISCORD_WEBHOOK_EDUCATION }}
          DISCORD_WEBHOOK_AI: ${{ secrets.DISCORD_WEBHOOK_AI }}
          DISCORD_WEBHOOK_CRYPTO: ${{ secrets.DISCORD_WEBHOOK_CRYPTO }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          EVENT: ${{ github.event_name }}
          TASK: ${{ inputs.task }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            python feeds_bot.py "$TASK"
          else
            python feeds_bot.py auto
          fi

      - name: Save memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: feeds-state-${{ github.run_id }}
