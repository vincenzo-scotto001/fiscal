name: Fiscal feeds

on:
  # Started on a timer by cron-job.org through GitHub's "Run workflow" API, with task=auto.
  # (GitHub's own schedule trigger never fired for this repo; see README > Scheduling.)
  workflow_dispatch:          # adds a "Run workflow" button on the Actions tab
    inputs:
      task:
        description: 'What to run'
        type: choice
        default: test-post
        options:
          - test-post
          - check
          - auto
          - earnings-week
          - earnings-today
          - earnings-results
          - macro-week
          - macro-morning
      dry_run:
        description: 'Preview only (prints the message in the log, posts nothing)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fiscal-feeds
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run Fiscal bot
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DISCORD_WEBHOOK_EARNINGS: ${{ secrets.DISCORD_WEBHOOK_EARNINGS }}
          DISCORD_WEBHOOK_MACRO: ${{ secrets.DISCORD_WEBHOOK_MACRO }}
          TASK: ${{ inputs.task }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python fiscal_bot.py "$TASK"
