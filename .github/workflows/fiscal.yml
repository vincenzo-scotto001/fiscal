name: Fiscal feeds

on:
  schedule:
    # All times are UTC: GitHub ignored the timezone setting on this repo.
    # Each post gets several chances, covering winter (EST) and summer (EDT) time plus a backup,
    # because GitHub can start scheduled runs late or skip them. fiscal_bot only posts inside the
    # right New York window and remembers what it already posted today, so nothing doubles.
    - cron: '41 11,12,13 * * 1-5'   # morning brief + earnings today (window 7 AM-noon ET)
    - cron: '7 0,1,2 * * 2-6'       # earnings results, evening before in ET (window from 8 PM ET)
    - cron: '7 22,23 * * 0'         # Sunday week ahead (window from 6 PM ET)
    - cron: '7 0 * * 1'             # Sunday week ahead, backup
  workflow_dispatch:          # adds a "Run workflow" button on the Actions tab
    inputs:
      task:
        description: 'What to run'
        type: choice
        default: test-post
        options:
          - test-post
          - check
          - earnings-week
          - earnings-today
          - earnings-results
          - macro-week
          - macro-morning
      dry_run:
        description: 'Preview only (prints the message in the log, posts nothing)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fiscal-feeds
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # Remembers what was posted today, so the backup runs don't post twice.
      - name: Restore memory
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: fiscal-state-${{ github.run_id }}
          restore-keys: fiscal-state-

      - name: Run Fiscal bot
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DISCORD_WEBHOOK_EARNINGS: ${{ secrets.DISCORD_WEBHOOK_EARNINGS }}
          DISCORD_WEBHOOK_MACRO: ${{ secrets.DISCORD_WEBHOOK_MACRO }}
          EVENT: ${{ github.event_name }}
          TASK: ${{ inputs.task }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            python fiscal_bot.py "$TASK"
          else
            python fiscal_bot.py auto
          fi

      - name: Save memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: fiscal-state-${{ github.run_id }}
