name: Schedule test (temporary)

# Posts nothing. Only checks whether GitHub fires scheduled runs on this repo.
# Remove this file once the test is done.
on:
  schedule:
    # A: plain UTC. Every 5 minutes from 10:01 AM to 12:56 PM New York time (15:01-17:56 UTC).
    - cron: '1-59/5 15-17 * * *'
    # B: same idea using the timezone setting. Every 5 minutes from 11:03 AM to 12:58 PM New York time.
    #    If B fires, the timezone setting works. If only A fires, the timezone line is the problem.
    - cron: '3-59/5 11-12 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report what triggered this run
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "Event: $EVENT"
          echo "Schedule: $SCHEDULE"
          case "$SCHEDULE" in
            "1-59/5 15-17 * * *") echo "=> A fired: GitHub schedules work (plain UTC)." ;;
            "3-59/5 11-12 * * *") echo "=> B fired: the timezone setting works too." ;;
          esac
          date -u
